<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Icons &amp; Heroes flippen</title>
<style>
  :root {
    color-scheme: light;
    --ground: #f2f3f6;
    --surface: #ffffff;
    --hairline: #e3e6ec;
    --ink: #12151c;
    --ink-2: #565d6b;
    --ink-muted: #868d9b;
    --accent: #1d3fa8;
    --cheap: #2a78d6;
    --dear: #d03b3b;
    --good-ink: #006300;
    --bad-ink: #b32626;
    --neutral-cell: #eef0f4;
    --f-body: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #0c0e13;
      --surface: #161a22;
      --hairline: #282e3a;
      --ink: #f2f4f8;
      --ink-2: #a3abba;
      --ink-muted: #7c8493;
      --accent: #7b9bf5;
      --cheap: #3987e5;
      --dear: #e66767;
      --good-ink: #4cc94c;
      --bad-ink: #f08585;
      --neutral-cell: #232834;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font: 15px/1.45 var(--f-body); }
  main { max-width: 820px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 4px 0 2px; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .sub { color: var(--ink-2); font-size: 13px; margin: 0 0 12px; }
  .card { background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .kpi .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .kpi .l { font-size: 12px; color: var(--ink-muted); }
  .muted { color: var(--ink-muted); font-size: 13px; }
  .good { color: var(--good-ink); } .bad { color: var(--bad-ink); }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tabs button {
    flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--hairline);
    background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; cursor: pointer;
  }
  .tabs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 600; }
  .flip { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--hairline); }
  .flip:last-child { border-bottom: 0; }
  .flip .gain { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .flip .hold { font-size: 12px; color: var(--ink-muted); }
  .heat { display: grid; grid-template-columns: 24px repeat(24, minmax(0, 1fr)); gap: 1px; font-size: 9px; }
  .heat .lbl { color: var(--ink-muted); display: flex; align-items: center; }
  .heat .hl { color: var(--ink-muted); text-align: center; }
  .heat .cell { aspect-ratio: 1 / 1.3; border-radius: 2px; background: var(--neutral-cell); }
  .legend { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); margin-top: 8px; }
  .legend i { width: 14px; height: 10px; border-radius: 2px; display: inline-block; }
  .bars { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 2px; height: 120px; }
  .bar { position: relative; }
  .bar i { position: absolute; left: 0; right: 0; border-radius: 2px; }
  .bar i.up { bottom: 50%; background: var(--dear); }
  .bar i.down { top: 50%; background: var(--cheap); }
  .axis { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 2px; font-size: 10px; color: var(--ink-muted); text-align: center; margin-top: 4px; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 6px; border-bottom: 1px solid var(--hairline); text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { font-size: 11px; color: var(--ink-muted); font-weight: 500; cursor: pointer; }
  .kind { font-size: 11px; color: var(--ink-muted); }
  table.compact td:first-child { white-space: normal; }
</style>
</head>
<body>
<main>
  <h1>Icons &amp; Heroes flippen</h1>
  <p class="sub">Icons (unter 500k) und Heroes (bis 500k): welche sind gerade unter Wert, und wann sind sie am billigsten und teuersten? Stündlich gemessen, alle Zahlen <b>ohne Steuer</b>, Uhrzeiten deutsche Zeit.</p>
  <div class="tabs" role="group" aria-label="Kartenart">
    <button data-kind="all" aria-pressed="true">Alle</button>
    <button data-kind="Icon" aria-pressed="false">Icons</button>
    <button data-kind="Hero" aria-pressed="false">Heroes</button>
  </div>
  <div id="app"><div class="card muted">Lade Daten …</div></div>
</main>
<script>
  // Written every hour by .github/workflows/fut-prices.yml (fut/run_collector.sh).
  var SRC = "https://raw.githubusercontent.com/hannesjere1-sketch/Sportwette/fut-data/icons-analysis.json";
  var WD = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
  var WD_LONG = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"];
  var data = null;
  var kind = "all";
  var sortKey = "price";
  try { kind = localStorage.getItem("fut-kind") || "all"; } catch (e) {}

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; });
  }
  function coins(n) { return Math.round(n).toLocaleString("de-DE"); }
  function pct(x) { return (x >= 0 ? "+" : "") + (x * 100).toFixed(1).replace(".", ",") + " %"; }
  function hh(h) { return (h < 10 ? "0" : "") + h + " Uhr"; }
  function when(iso) { return new Date(iso).toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" }); }

  function sectionFor(d) {
    return kind === "all" ? d.all : (d.byKind[kind] || null);
  }

  function hm(iso) {
    return new Date(iso).toLocaleString("de-DE", { weekday: "short", hour: "2-digit", minute: "2-digit" });
  }

  function dipsCard(d) {
    var dp = d.dips;
    if (!dp) return "";
    var html = '<div class="card"><h2>Schnäppchen: jetzt unter dem üblichen Preis</h2>';
    var mk = dp.market || {};
    var mkKinds = Object.keys(mk).filter(function (k) { return kind === "all" || k === kind; });
    if (mkKinds.length) {
      html += '<p class="muted">Gesamtmarkt gegenüber den letzten 24 h: ' + mkKinds.map(function (k) {
        return (k === "Icon" ? "Icons " : "Heroes ") + '<b class="' + (mk[k] < -0.02 ? "bad" : "") + '">' + pct(mk[k]) + "</b>";
      }).join(", ") + (mkKinds.some(function (k) { return mk[k] < -0.02; })
        ? " – der Markt fällt gerade insgesamt, Schnäppchen können weiter fallen." : "") + "</p>";
    }
    var sig = dp.signals.filter(function (x) { return kind === "all" || x.kind === kind; });
    if (!sig.length) {
      html += '<p class="muted">Gerade liegt keine Karte mindestens 5 % unter ihrem Preis der letzten 24 Stunden.</p>';
    } else {
      html += '<div class="scroll"><table class="compact"><tr><th>Karte</th><th>jetzt</th><th>üblich</th><th>Ziel</th></tr>';
      sig.slice(0, 25).forEach(function (x) {
        html += "<tr><td>" + esc(x.name) + '<div class="kind">' + x.kind + "</div></td><td>" + coins(x.price) +
          '<div class="kind">' + pct(x.discount) + "</div></td><td>" + coins(x.usual) + '</td><td class="good"><b>' + pct(x.upside) + "</b></td></tr>";
      });
      html += "</table></div>";
    }
    html += '<p class="muted">„üblich“ = Median der letzten 24 Stunden. „Ziel“ = so viel mehr, wenn du zum üblichen Preis verkaufst, ohne Steuer. Stand der letzten stündlichen Messung – Preis im Spiel vor dem Kauf prüfen.</p></div>';

    var lv = dp.levels;
    html += '<div class="card"><h2>Bilanz der Schnäppchen-Regel</h2>';
    html += '<p class="muted">Regel: kaufen, wenn eine Karte X % unter ihrem 24-Stunden-Median liegt; verkaufen, sobald sie ihn wieder erreicht, spätestens nach 12 Stunden. Entschieden wird nur mit dem, was zum Kaufzeitpunkt bekannt war. Ohne Steuer, alle Karten.</p>';
    html += '<div class="scroll"><table><tr><th>Regel</th><th>Flips</th><th>Ø</th><th>im Plus</th><th>Ziel erreicht</th><th>Ø Haltezeit</th></tr>';
    Object.keys(lv).forEach(function (k) {
      var l = lv[k];
      var label = "ab " + Math.round(Number(k) * 100) + " % drunter";
      if (!l.trades) { html += "<tr><td>" + label + '</td><td>0</td><td colspan="4" class="muted">noch keine</td></tr>'; return; }
      html += "<tr><td>" + (Number(k) === dp.defaultDepth ? "<b>" + label + "</b>" : label) + "</td><td>" + l.trades + '</td><td class="' +
        (l.avgGain >= 0 ? "good" : "bad") + '"><b>' + pct(l.avgGain) + "</b></td><td>" + Math.round(l.winRate * 100) + " %</td><td>" +
        Math.round(l.hitRate * 100) + " %</td><td>" + l.avgHours.toFixed(1).replace(".", ",") + " h</td></tr>";
    });
    html += "</table></div>";
    var rec = dp.recent.filter(function (r) { return kind === "all" || r.kind === kind; });
    if (rec.length) {
      html += '<h2 style="margin-top:14px">Letzte Flips nach der Regel (ab ' + Math.round(dp.defaultDepth * 100) + ' %)</h2><div class="scroll"><table>' +
        "<tr><th>Karte</th><th>Kauf</th><th>Verkauf</th><th>Ergebnis</th></tr>";
      rec.forEach(function (r) {
        html += "<tr><td>" + esc(r.name) + "</td><td>" + coins(r.buy) + '<div class="kind">' + hm(r.buyAt) + "</div></td><td>" +
          coins(r.sell) + '<div class="kind">' + hm(r.sellAt) + (r.hit ? "" : " (Zeit um)") + '</div></td><td class="' +
          (r.gain >= 0 ? "good" : "bad") + '"><b>' + pct(r.gain) + "</b></td></tr>";
      });
      html += "</table></div>";
    }
    return html + "</div>";
  }

  function flipsCard(s) {
    var html = '<div class="card"><h2>Beste Flips: wann kaufen, wann verkaufen</h2>';
    if (!s.flips.length) {
      return html + '<p class="muted">Noch zu wenig Daten. Jede Karte braucht mindestens 24 Stunden Preise, und jeder Wochentag muss mindestens einmal vorkommen, damit er hier auftaucht.</p></div>';
    }
    s.flips.forEach(function (f) {
      html += '<div class="flip"><div><b>' + WD_LONG[f.buyDay] + " " + hh(f.buyHour) + "</b> kaufen → <b>" +
        WD_LONG[f.sellDay] + " " + hh(f.sellHour) + '</b> verkaufen<div class="hold">' + f.hold + " Stunden halten</div></div>" +
        '<div class="gain ' + (f.gain >= 0 ? "good" : "bad") + '">' + pct(f.gain) + "</div></div>";
    });
    return html + '<p class="muted">Aus der Wochen-Heatmap unten abgelesen: Unterschied zwischen dem typischen Preis beim Kauf und beim Verkauf, ohne Steuer. Je mehr Wochen gesammelt sind, desto belastbarer.</p></div>';
  }

  function heatCard(s) {
    var cells = {}, max = 0;
    s.heat.forEach(function (c) { cells[c.day + "-" + c.hour] = c; max = Math.max(max, Math.abs(c.ratio - 1)); });
    var html = '<div class="card"><h2>Wochen-Heatmap</h2><div class="heat"><span></span>';
    for (var h = 0; h < 24; h++) html += '<span class="hl">' + (h % 3 === 0 ? h : "") + "</span>";
    for (var d = 0; d < 7; d++) {
      html += '<span class="lbl">' + WD[d] + "</span>";
      for (h = 0; h < 24; h++) {
        var c = cells[d + "-" + h];
        if (!c) { html += '<span class="cell" title="' + WD[d] + " " + hh(h) + ': noch keine Daten"></span>'; continue; }
        var dev = c.ratio - 1;
        var strength = max ? Math.min(1, Math.abs(dev) / max) : 0;
        var color = dev < 0 ? "var(--cheap)" : "var(--dear)";
        html += '<span class="cell" style="background:color-mix(in srgb, ' + color + " " + Math.round(strength * 100) +
          '%, var(--neutral-cell))" title="' + WD[d] + " " + hh(h) + ": " + pct(dev) + " (" + c.n + ' Messungen)"></span>';
      }
    }
    html += '</div><div class="legend"><i style="background:var(--cheap)"></i>billiger als üblich <i style="background:var(--neutral-cell)"></i>normal <i style="background:var(--dear)"></i>teurer als üblich</div>';
    html += '<p class="muted">Jedes Feld: wie weit der Preis zu dieser Stunde über oder unter dem Preisniveau der umliegenden 3 Tage liegt, über alle Karten. Antippen zeigt den Wert. Leere Felder kommen mit den nächsten Tagen dazu.</p></div>';
    return html;
  }

  function hourCard(s) {
    var prof = s.hourProfile;
    var hours = Object.keys(prof).map(Number);
    var html = '<div class="card"><h2>Tagesverlauf (alle Wochentage)</h2>';
    if (hours.length < 2) return html + '<p class="muted">Noch zu wenig Daten.</p></div>';
    var max = 0, cheap = hours[0], dear = hours[0];
    hours.forEach(function (h) {
      max = Math.max(max, Math.abs(prof[h] - 1));
      if (prof[h] < prof[cheap]) cheap = h;
      if (prof[h] > prof[dear]) dear = h;
    });
    var bars = "", axis = "";
    for (var h = 0; h < 24; h++) {
      var v = prof[h];
      var inner = v === undefined ? "" : '<i class="' + (v >= 1 ? "up" : "down") + '" style="height:' + (Math.abs(v - 1) / max * 50).toFixed(1) + '%"></i>';
      bars += '<div class="bar" title="' + hh(h) + (v === undefined ? "" : ": " + pct(v - 1)) + '">' + inner + "</div>";
      axis += "<span>" + (h % 3 === 0 ? h : "") + "</span>";
    }
    html += '<div class="bars">' + bars + '</div><div class="axis">' + axis + "</div>";
    html += '<p class="muted">Am billigsten um <b>' + hh(cheap) + " (" + pct(prof[cheap] - 1) + ")</b>, am teuersten um <b>" + hh(dear) +
      " (" + pct(prof[dear] - 1) + ")</b>. Unterschied <b>" + pct(prof[dear] / prof[cheap] - 1) + "</b> ohne Steuer.</p></div>";
    return html;
  }

  function testCard(s) {
    var w = s.walkForward;
    var html = '<div class="card"><h2>Ehrlicher Test</h2>';
    if (!w.trades) {
      return html + '<p class="muted">Noch keine Flips. Für jeden Tag werden die billigste und die teuerste Stunde nur aus den Vortagen gelernt und dann an diesem Tag geflippt. Dafür braucht es erst 3 volle Tage.</p></div>';
    }
    html += '<div class="kpis">' +
      '<div class="kpi"><div class="v ' + (w.avgGain >= 0 ? "good" : "bad") + '">' + pct(w.avgGain) + '</div><div class="l">Ø pro Flip, ohne Steuer' +
      (w.avgGainLow !== undefined ? " (sicher mindestens " + pct(w.avgGainLow) + ")" : "") + "</div></div>" +
      '<div class="kpi"><div class="v">' + Math.round(w.winRate * 100) + ' %</div><div class="l">Flips im Plus</div></div>' +
      '<div class="kpi"><div class="v">' + w.trades + '</div><div class="l">Flips an ' + w.days + " Tagen</div></div>" +
      '<div class="kpi"><div class="v ' + (w.coins >= 0 ? "good" : "bad") + '">' + coins(w.coins) + '</div><div class="l">Coins zusammen (1 Karte je Flip)</div></div>' +
      "</div>";
    return html + '<p class="muted">Hier zeigt sich, ob das Muster auch an Tagen hält, die vorher niemand kannte. Was nur im Rückblick funktioniert, fällt hier durch.</p></div>';
  }

  function cardsCard(d) {
    var list = d.cards.filter(function (c) { return kind === "all" || c.kind === kind; });
    list.sort(function (a, b) {
      if (sortKey === "spread") return (b.spread || -1) - (a.spread || -1);
      if (sortKey === "name") return a.name.localeCompare(b.name);
      return b.price - a.price;
    });
    var html = '<div class="card"><h2>Karten (' + list.length + ')</h2><div class="scroll"><table><tr>' +
      '<th data-sort="name">Karte</th><th data-sort="price">Preis ▾</th><th>7T-Tief</th><th>7T-Hoch</th><th>billig</th><th>teuer</th><th data-sort="spread">Spanne ▾</th></tr>';
    list.forEach(function (c) {
      html += "<tr><td>" + esc(c.name) + ' <span class="kind">' + (c.kind === "Icon" ? "Icon" : "Hero") + "</span></td>" +
        "<td>" + coins(c.price) + "</td><td>" + coins(c.low7) + "</td><td>" + coins(c.high7) + "</td>" +
        "<td>" + (c.cheapHour !== undefined ? c.cheapHour + "h" : "–") + "</td>" +
        "<td>" + (c.dearHour !== undefined ? c.dearHour + "h" : "–") + "</td>" +
        "<td>" + (c.spread !== undefined ? pct(c.spread) : "–") + "</td></tr>";
    });
    return html + '</table></div><p class="muted">Preise: günstigster Sofortkauf laut EasySBC. „billig“ und „teuer“ sind die Stunden, in denen die Karte typischerweise am günstigsten bzw. teuersten ist. „Spanne“ ist der Unterschied dazwischen, ohne Steuer. Spaltenkopf antippen zum Sortieren.</p></div>';
  }

  function render() {
    var d = data;
    var s = sectionFor(d);
    var icons = d.byKind.Icon ? d.byKind.Icon.cards : 0;
    var heroes = d.byKind.Hero ? d.byKind.Hero.cards : 0;
    var html = '<div class="card kpis">' +
      '<div class="kpi"><div class="v">' + icons + " / " + heroes + '</div><div class="l">Icons / Heroes beobachtet</div></div>' +
      '<div class="kpi"><div class="v">' + d.hoursCovered + '</div><div class="l">Stunden gesammelt</div></div>' +
      '<div class="kpi"><div class="v">' + when(d.lastSeen) + '</div><div class="l">letzte Messung</div></div>' +
      "</div>";
    if (!s) {
      html += '<div class="card muted">Für diese Kartenart gibt es noch keine Daten.</div>';
    } else {
      html += dipsCard(d) + flipsCard(s) + heatCard(s) + hourCard(s) + testCard(s);
    }
    html += cardsCard(d);
    document.getElementById("app").innerHTML = html;
    Array.prototype.forEach.call(document.querySelectorAll("th[data-sort]"), function (th) {
      th.addEventListener("click", function () { sortKey = th.getAttribute("data-sort"); render(); });
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll(".tabs button"), function (b) {
    b.setAttribute("aria-pressed", String(b.getAttribute("data-kind") === kind));
    b.addEventListener("click", function () {
      kind = b.getAttribute("data-kind");
      try { localStorage.setItem("fut-kind", kind); } catch (e) {}
      Array.prototype.forEach.call(document.querySelectorAll(".tabs button"), function (o) {
        o.setAttribute("aria-pressed", String(o === b));
      });
      if (data) render();
    });
  });

  fetch(SRC + "?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (d) { data = d; render(); })
    .catch(function (e) {
      document.getElementById("app").innerHTML =
        '<div class="card muted">Noch keine Daten (' + esc(e.message) + "). Die erste stündliche Messung muss erst gelaufen sein.</div>";
    });
</script>
</body>
</html>
