name: Analyse aufbauen

on:
  schedule:
    # An hour after the fixture job, so the two never contend for Pages.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The run paces itself against the per-minute limit, so it takes a while.
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Faelle auswerten
        env:
          # Only ever an environment variable — never a command line, never a URL.
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python .github/scripts/build_analysis.py

      - name: Fortschritt sichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage first: git diff does not see files that are still untracked,
          # which on the first run is exactly what both of these are.
          git add data/analysis-state.json public/analysis.json
          if git diff --cached --quiet; then
            echo "Keine Aenderung — kein Commit noetig."
            exit 0
          fi
          git commit -m "Analyse fortgeschrieben"
          git push

      - name: Seite zusammenstellen
        run: |
          rm -rf _site
          cp -r static-app _site
          for f in fixtures.json analysis.json; do
            if [ -f "public/$f" ]; then cp "public/$f" "_site/$f"; fi
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
