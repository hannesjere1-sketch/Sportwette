name: API-Football pruefen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Torminuten pruefen
        env:
          # Only ever an environment variable — never a command line, never a URL.
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python .github/scripts/probe_api_football.py
