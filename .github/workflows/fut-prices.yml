name: FUT-Preise sammeln (Icons & Heroes)

on:
  schedule:
    # Each run collects for almost 6 hours on its own (fut/run_collector.sh).
    # GitHub skips most runs of a frequent schedule, so these are only
    # restart points: whichever fires while a run is still busy just queues
    # behind it and takes over when it ends.
    - cron: "13 * * * *"
    - cron: "43 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fut-prices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The readings live on their own branch: a commit every ten minutes would
      # otherwise bury the code history.
      - name: Datenbranch holen
        run: |
          if git ls-remote --exit-code --heads origin fut-data >/dev/null; then
            git fetch --depth 1 origin +fut-data:refs/remotes/origin/fut-data
            git worktree add -B fut-data _data origin/fut-data
          else
            git worktree add --orphan -b fut-data _data
          fi

      - name: Icons und Heroes sammeln, Kandidaten alle 10 Minuten nachmessen (knapp 6 Stunden)
        env:
          # Push channels (see fut/recheck.py). Secrets, because whoever knows
          # a topic or token can read or send. Any left unset is skipped.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Pushes only for cards at most this expensive (GitHub variable,
          # Settings → Secrets and variables → Actions → Variables). Unset: 250,000.
          PUSH_MAX_PRICE: ${{ vars.PUSH_MAX_PRICE }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash fut/run_collector.sh
