name: Deploy Wettportal

on:
  push:
    branches: [claude/sportwetten-automation-portal-kpcs72]
    paths:
      - "static-app/**"
      - "public/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Seite zusammenstellen
        run: |
          rm -rf _site
          cp -r static-app _site
          # The data files live outside the site folder; publish them alongside
          # so the page can read them as plain relative files.
          for f in fixtures.json analysis.json; do
            if [ -f "public/$f" ]; then cp "public/$f" "_site/$f"; fi
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
